[package]
name = "ttime-wasm"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Thin WebAssembly bridge over ttime-core for the T-Time writing room"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
ttime-core = { path = "../ttime-core" }
# Must equal the installed wasm-bindgen CLI (scripts/build-web.sh checks this).
wasm-bindgen = "=0.2.130"

[profile.release]
opt-level = "s"
lto = true

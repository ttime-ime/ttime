<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>T-Time parity check</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header><h1>Parity check <span class="sub">Wasm build against the curated fixtures</span></h1><p class="build" id="build"></p></header>
<main>
  <p class="hint">Runs every fixture line through the WebAssembly build and compares with the expected text, the same check the native Rust tests make. Generated fixtures are copied here by <code>scripts/build-web.sh</code>.</p>
  <p id="summary" role="status">running…</p>
  <table id="files"></table>
  <pre id="failures"></pre>
  <p><a href="index.html">Back to the writing room</a></p>
</main>
<script type="module">
import init, { convert_json, version } from "./pkg/ttime_wasm.js";
const unescape = (s) => s.replace(/\\u([0-9A-Fa-f]{4})/g, (_, h) => String.fromCodePoint(parseInt(h, 16)));
await init();
document.getElementById("build").textContent = version();
const names = (await (await fetch("fixtures/index.txt")).text()).split("\n").filter((n) => n.endsWith(".tsv"));
let total = 0, failed = 0, out = [];
const table = document.getElementById("files");
for (const name of names) {
  const text = await (await fetch("fixtures/" + name)).text();
  const pre = name === "precomposed.tsv";
  let n = 0, bad = 0;
  for (const line of text.split("\n")) {
    if (!line || line.startsWith("#")) continue;
    const tab = line.indexOf("\t");
    if (tab < 0) continue;
    const input = line.slice(0, tab), expected = unescape(line.slice(tab + 1));
    const got = JSON.parse(convert_json(input, pre)).text;
    n++;
    if (got !== expected) { bad++; out.push(`${name}: ${JSON.stringify(input)} expected ${[...expected].map(c=>c.codePointAt(0).toString(16)).join(" ")} got ${[...got].map(c=>c.codePointAt(0).toString(16)).join(" ")}`); }
  }
  total += n; failed += bad;
  table.insertAdjacentHTML("beforeend", `<tr><td>${name}</td><td>${n}</td><td>${bad ? bad + " failed" : "ok"}</td></tr>`);
}
document.getElementById("summary").textContent = `${total} cases, ${failed} failed`;
document.getElementById("failures").textContent = out.join("\n");
document.title = `parity: ${total} cases, ${failed} failed`;
</script>
</body>
</html>

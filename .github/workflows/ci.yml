name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  WASM_BINDGEN_VERSION: "0.2.130" # must equal the pin in crates/ttime-wasm/Cargo.toml

jobs:
  rust:
    name: Rust (fmt, clippy, tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install stable --profile minimal -c rustfmt,clippy
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rust-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  wasm:
    name: WebAssembly bridge
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install stable --profile minimal -t wasm32-unknown-unknown
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/wasm-bindgen
            target
          key: wasm-${{ runner.os }}-${{ env.WASM_BINDGEN_VERSION }}-${{ hashFiles('Cargo.lock') }}
      - run: command -v wasm-bindgen || cargo install --locked wasm-bindgen-cli --version "$WASM_BINDGEN_VERSION"
      - name: Build the bridge into a scratch playground
        run: |
          mkdir -p "$RUNNER_TEMP/playground"
          scripts/build-web.sh "$RUNNER_TEMP/playground"

  macos:
    name: macOS input method and installer (universal, unsigned)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install stable --profile minimal -t aarch64-apple-darwin,x86_64-apple-darwin
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: macos-${{ hashFiles('Cargo.lock') }}
      - run: UNIVERSAL=1 scripts/build-macos.sh
      - name: Installer package (unsigned, to check that it builds)
        run: scripts/build-pkg.sh
      - uses: actions/upload-artifact@v7
        with:
          name: T-Time-ci-unsigned
          path: build/macos/T-Time-*.pkg
          retention-days: 7

  ffi-linux:
    name: FFI smoke (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install stable --profile minimal
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ffi-linux-${{ hashFiles('Cargo.lock') }}
      - run: scripts/build-ffi-smoke.sh

  ffi-windows:
    name: FFI smoke (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install stable --profile minimal
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ffi-windows-${{ hashFiles('Cargo.lock') }}
      - run: pwsh -File scripts/build-ffi-smoke.ps1

  windows-tsf:
    name: Windows TSF DLL
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install stable --profile minimal
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: windows-tsf-${{ hashFiles('Cargo.lock') }}
      - run: pwsh -File scripts/build-windows-tsf.ps1
      - uses: actions/upload-artifact@v7
        with:
          name: TTimeTSF-ci
          path: |
            build/windows/TTimeTSF.dll
            build/windows/ttime_ffi.lib
          retention-days: 7
